<!DOCTYPE html>
<html dir="rtl">
<head>
<style>
  ul, ol { margin: 0; padding: 0; list-style: none; }
  li { position: relative; padding-right: 2rem; padding-left: 0; direction: rtl; text-align: right; }
  li::before { content: "•"; position: absolute; right: 0; top: 0; width: 1.75rem; text-align: right; }
</style>
</head>
<body>
  <ul>
    <li>Item 1
      <ul>
        <li>Nested 1</li>
        <li>Nested 2</li>
      </ul>
    </li>
  </ul>
</body>
</html>
